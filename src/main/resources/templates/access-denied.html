<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 접근 거부 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="text-center">
        <h1 class="display-6 fw-bold text-danger mb-3">403 Forbidden</h1>
        <p class="lead mb-2">접근 권한이 없습니다.</p>
        <p class="text-muted mb-4">이 기능은 관리자(ADMIN)만 사용할 수 있습니다.</p>
        <a th:href="@{/products}" class="btn btn-primary me-2">상품 목록</a>
        <a th:href="@{/home}" class="btn btn-outline-secondary">홈으로</a>
    </div>
</div>

<p class="text-center text-muted small py-3 mt-4 border-top mb-0"
   th:text="${'실습 수행: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')
             + '  |  학번: 2171134  |  이름: 권성호'}"></p>
</body>
</html>
